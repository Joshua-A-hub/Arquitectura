openapi: 3.0.3
info:
  title: API de Facturación Electrónica — ABC Software Corp
  version: 2.0.0
  description: |
    Contrato de servicios del sistema de facturación electrónica: emisión de comprobantes
    (UBL 2.1 Invoice), notas, baja, migración del legado y libros SUNAT 12.1 y 14.1.

    **Nomenclatura:** el identificador del comprobante es `serie_numero`
    (`serie + "-" + correlativo`, ej. `F001-00000123`) y se mapea a `cbc:ID` del UBL.

    **Importes:** viajan como *string decimal* (`"1250.50"`), nunca como número de coma flotante.

    **Validación:** el XML se valida contra el esquema oficial de OASIS *antes* de firmarse (RN-18).

    **Seguridad:** todas las operaciones exigen `bearerAuth` y declaran `401` y `403`.
security:
  - bearerAuth: []
x-catalogo-errores:
  - http: 400
    codigo: VALIDACION_ESQUEMA
    causa: el JSON no cumple el DTO (tipo, formato, obligatorio)
    accion: el cliente corrige el campo señalado en errores[].campo
  - http: 401
    codigo: NO_AUTORIZADO
    causa: token ausente o vencido
    accion: renovar credencial
  - http: 403
    codigo: PROHIBIDO
    causa: el token no tiene el rol requerido (emisión, baja, migración)
    accion: solicitar permiso al administrador
  - http: 404
    codigo: NO_ENCONTRADO
    causa: el comprobante o recurso no existe
    accion: verificar el identificador
  - http: 409
    codigo: CONFLICTO
    causa: correlativo duplicado o comprobante ya dado de baja
    accion: reintentar con otra clave de idempotencia
  - http: 422
    codigo: VALIDACION_NEGOCIO
    causa: incumple una regla tributaria (RN-01..RN-24, ISC, catálogo 06/08)
    accion: corregir el dato; el error indica el campo
  - http: 500
    codigo: XML_INVALIDO
    causa: el XML no valida contra el esquema oficial (no se firmó ni se registró)
    accion: incidente técnico
  - http: 502
    codigo: ERROR_ENVIO
    causa: la OSE/SUNAT no respondió; el comprobante queda PENDIENTE_ENVIO
    accion: reintento automático con backoff (RN-20)
servers:
  - url: http://localhost:8080
    description: Despliegue local (Windows / Android)
tags:
  - name: Comprobantes
  - name: Notas
  - name: Bajas
  - name: Maestros
  - name: Migración
  - name: Libros SUNAT

paths:
  /api/v1/comprobantes:
    post:
      tags: [Comprobantes]
      summary: Emitir un comprobante electrónico
      description: |
        Orden obligatorio (RN-18): validar esquema → validar reglas → calcular (IGV, ISC por
        sistema, ICBPER) → generar XML → **validar contra el esquema oficial** → firmar → enviar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComprobanteCreate'
      responses:
        '201':
          description: Comprobante emitido y aceptado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobanteResponse'
        '400':
          $ref: '#/components/responses/ErrorEsquema'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorNegocio'
        '500':
          $ref: '#/components/responses/XmlInvalido'
        '502':
          $ref: '#/components/responses/ErrorEnvio'
    get:
      tags: [Comprobantes]
      summary: Listar comprobantes con filtros y paginación
      parameters:
        - name: tipo
          in: query
          schema: { type: string, enum: ['01', '03', '07', '08'] }
        - name: estado
          in: query
          schema:
            type: string
            enum: [BORRADOR, EMITIDO, ACEPTADO, RECHAZADO, PENDIENTE_ENVIO, BAJA]
        - name: desde
          in: query
          schema: { type: string, format: date }
        - name: hasta
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListadoComprobantes'
        '400':
          description: Filtros inválidos (fecha mal formada, página negativa)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/comprobantes/{id}:
    get:
      tags: [Comprobantes]
      summary: Consultar un comprobante por su identificador interno
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Comprobante encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobanteResponse'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/v1/comprobantes/{id}/xml:
    get:
      tags: [Comprobantes]
      summary: Descargar el XML firmado (evidencia del comprobante)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: XML UBL 2.1 validado contra el esquema oficial
          content:
            application/xml:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/v1/comprobantes/{id}/notas:
    post:
      tags: [Notas]
      summary: Emitir una nota de crédito o débito sobre un comprobante aceptado
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotaCreate'
      responses:
        '201':
          description: Nota emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobanteResponse'
        '400':
          $ref: '#/components/responses/ErrorEsquema'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorNegocio'

  /api/v1/comprobantes/{id}/baja:
    post:
      tags: [Bajas]
      summary: Solicitar la baja de un comprobante aceptado
      description: |
        La comunicación de baja es **asíncrona**: se acepta la solicitud, se devuelve un ticket y el
        estado final se consulta con ese ticket (SUNAT responde con número de ticket).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  minLength: 5
                  maxLength: 200
      responses:
        '202':
          description: Solicitud de baja aceptada para procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaAceptada'
        '400':
          $ref: '#/components/responses/ErrorEsquema'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El comprobante no está en estado ACEPTADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'

  /api/v1/migracion/fichas:
    post:
      tags: [Migración]
      summary: Migrar fichas del sistema legado
      description: |
        Procesa un lote de fichas (fecha, ingreso, salida, producto, nro_documento). Cada ficha
        termina MIGRADA u OBSERVADA (RN-22): nunca se descarta en silencio. El lote se procesa de
        forma asíncrona y devuelve un ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigracionRequest'
      responses:
        '202':
          description: Lote aceptado para procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaAceptada'
        '400':
          $ref: '#/components/responses/ErrorEsquema'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/ErrorNegocio'

  /api/v1/migracion/tareas/{ticket}:
    get:
      tags: [Migración]
      summary: Consultar el resultado de un lote de migración
      parameters:
        - name: ticket
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado y resultado del lote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigracionResponse'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/v1/movimientos-almacen:
    post:
      tags: [Libros SUNAT]
      summary: Registrar un movimiento de almacén (alimenta el libro 12.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovimientoAlmacen'
      responses:
        '201':
          description: Movimiento registrado con saldo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimientoAlmacen'
        '400':
          $ref: '#/components/responses/ErrorEsquema'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/ErrorNegocio'
    get:
      tags: [Libros SUNAT]
      summary: Listar movimientos por producto y período (kardex)
      parameters:
        - name: producto
          in: query
          schema: { type: string }
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Movimientos del período
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovimientoAlmacen'
        '400':
          description: Rango de fechas inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/libros/14-1:
    get:
      tags: [Libros SUNAT]
      summary: Registro de Ventas e Ingresos (Formato 14.1) del período
      parameters:
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Registro de ventas del período
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistroVenta'
        '400':
          description: Rango de fechas inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/clientes:
    get:
      tags: [Maestros]
      summary: Listar clientes
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
        '400':
          description: Paginación inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Maestros]
      summary: Registrar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/ErrorEsquema'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/ErrorNegocio'

  /api/v1/productos:
    get:
      tags: [Maestros]
      summary: Listar productos con su afectación e ISC
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '400':
          description: Filtros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/catalogos/{codigo}:
    get:
      tags: [Maestros]
      summary: Consultar un catálogo SUNAT (01, 02, 03, 05, 06, 07, 08, 09, 10, 51)
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string, enum: ['01', '02', '03', '05', '06', '07', '08', '09', '10', '51'] }
      responses:
        '200':
          description: Entradas del catálogo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    codigo: { type: string }
                    descripcion: { type: string }
        '400':
          description: Código de catálogo inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token del emisor. El sub determina el RUC del emisor y la empresa; el cuerpo de la petición
        no puede cambiarlo.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NoAutorizado:
      description: Token ausente o vencido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
    Prohibido:
      description: Sin rol suficiente para la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
    ErrorEsquema:
      description: El cuerpo no cumple el DTO
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
    ErrorNegocio:
      description: Regla tributaria incumplida (RN, ISC, catálogos)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
    Conflicto:
      description: Correlativo duplicado o estado incompatible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
    XmlInvalido:
      description: El XML no valida contra el esquema oficial; no se firmó ni se registró
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
    ErrorEnvio:
      description: La OSE no respondió; el comprobante queda PENDIENTE_ENVIO
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'

  schemas:
    ComprobanteCreate:
      type: object
      required: [tipo, serie, fecha_emision, hora_emision, moneda, forma_pago, cliente, detalle]
      properties:
        tipo:
          type: string
          enum: ['01', '03']
        serie:
          type: string
          pattern: '^[FB][A-Z0-9]{3}$'
          description: 4 caracteres; 3 alfanuméricos (F001, FC01, BA01)
          example: F001
        fecha_emision:
          type: string
          format: date
          example: '2026-10-22'
        hora_emision:
          type: string
          pattern: '^[0-2][0-9]:[0-5][0-9]:[0-5][0-9]$'
        moneda:
          type: string
          enum: [PEN, USD]
        tipo_operacion:
          type: string
          default: '0101'
        forma_pago:
          type: string
          enum: [CONTADO, CREDITO]
        cuotas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Cuota'
        cliente:
          $ref: '#/components/schemas/ClienteRef'
        detalle:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/LineaDetalle'
        observaciones:
          type: string
          maxLength: 500

    LineaDetalle:
      type: object
      required: [numero_linea, producto_codigo, descripcion, unidad_medida, cantidad, precio_unitario, afectacion_igv]
      properties:
        numero_linea: { type: integer, minimum: 1 }
        producto_codigo: { type: string, maxLength: 30 }
        descripcion: { type: string, minLength: 3, maxLength: 200 }
        unidad_medida:
          type: string
          enum: [NIU, KGM, BX, LTR, ZZ]
        cantidad:
          type: number
          exclusiveMinimum: true
          minimum: 0
        precio_unitario:
          type: string
          pattern: '^\d+(\.\d{1,10})?$'
          description: Precio de venta al público (con IGV), como texto
          example: '45.00'
        descuento:
          type: string
          pattern: '^\d+(\.\d{1,10})?$'
          default: '0.00'
        afectacion_igv:
          type: string
          enum: ['10', '11', '20', '21', '30', '31', '40']
        sistema_isc:
          type: string
          nullable: true
          enum: ['01', '02', '03']
          description: Catálogo 08 — 01 ad valorem, 02 específico, 03 al valor (RN-06)
        tasa_isc:
          type: string
          pattern: '^\d+(\.\d{1,10})?$'
          description: Exigido por el sistema 01
        monto_fijo_isc:
          type: string
          pattern: '^\d+(\.\d{1,10})?$'
          description: Exigido por el sistema 02 (S/ por unidad)
        precio_venta_publico:
          type: string
          pattern: '^\d+(\.\d{1,10})?$'
          description: Exigido por el sistema 03 (PVP sin IGV)

    ClienteRef:
      type: object
      required: [tipo_documento, numero_documento, razon_social]
      properties:
        tipo_documento:
          type: string
          enum: ['0', '1', '4', '6', '7', 'A']
          description: Catálogo 06
        numero_documento: { type: string, minLength: 1, maxLength: 15 }
        razon_social: { type: string, minLength: 3, maxLength: 200 }
        ubigeo: { type: string, pattern: '^[0-9]{6}$' }
        direccion: { type: string, maxLength: 200 }

    Cliente:
      allOf:
        - $ref: '#/components/schemas/ClienteRef'
        - type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }

    Producto:
      type: object
      required: [codigo, descripcion, unidad_medida, precio_unitario, afectacion_igv]
      properties:
        codigo: { type: string, maxLength: 30 }
        descripcion: { type: string, maxLength: 200 }
        unidad_medida: { type: string, enum: [NIU, KGM, BX, LTR, ZZ] }
        precio_unitario: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        afectacion_igv: { type: string, enum: ['10', '11', '20', '21', '30', '31', '40'] }
        sistema_isc:
          type: string
          nullable: true
          enum: ['01', '02', '03']
        tasa_isc: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        monto_fijo_isc: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        precio_venta_publico: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        es_bolsa_plastica: { type: boolean }

    Cuota:
      type: object
      required: [monto, fecha_vencimiento]
      properties:
        monto: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        fecha_vencimiento: { type: string, format: date }

    NotaCreate:
      type: object
      required: [tipo, motivo_codigo, descripcion_motivo, lineas]
      properties:
        tipo:
          type: string
          enum: ['07', '08']
        motivo_codigo:
          type: string
          description: Catálogo 09 (NC) o 10 (ND)
        descripcion_motivo: { type: string, minLength: 3, maxLength: 200 }
        lineas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineaDetalle'

    Totales:
      type: object
      properties:
        op_gravada: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        op_exonerada: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        op_inafecta: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        op_exportacion: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        total_igv: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        total_isc: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        total_icbper: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        importe_total: { type: string, pattern: '^\d+(\.\d{1,10})?$' }

    Cdr:
      type: object
      properties:
        codigo: { type: string, example: '0' }
        descripcion: { type: string }
        fecha_recepcion: { type: string, format: date-time }

    ComprobanteResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string }
        serie: { type: string }
        correlativo: { type: integer }
        serie_numero:
          type: string
          pattern: '^[FB][A-Z0-9]{3}-[0-9]{1,8}$'
          example: F001-00000123
        estado:
          type: string
          enum: [BORRADOR, EMITIDO, ACEPTADO, RECHAZADO, PENDIENTE_ENVIO, BAJA]
        fecha_emision: { type: string, format: date }
        cliente: { $ref: '#/components/schemas/ClienteRef' }
        totales: { $ref: '#/components/schemas/Totales' }
        hash_xml: { type: string }
        xml_url: { type: string }
        cdr: { $ref: '#/components/schemas/Cdr' }

    ListadoComprobantes:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComprobanteResponse'

    TareaAceptada:
      type: object
      description: Respuesta 202 de un proceso asíncrono (baja o migración)
      required: [ticket, estado, recurso]
      properties:
        ticket: { type: string, format: uuid }
        estado:
          type: string
          enum: [EN_COLA, EN_PROCESO]
        recurso:
          type: string
          description: URL para consultar el resultado
          example: /api/v1/migracion/tareas/3f2b…
        mensaje: { type: string }

    FichaLegada:
      type: object
      required: [id_ficha, fecha, producto]
      properties:
        id_ficha: { type: string, maxLength: 50 }
        fecha: { type: string, format: date }
        ingreso: { type: string, nullable: true }
        salida: { type: string, nullable: true }
        producto: { type: string, maxLength: 200 }
        nro_documento: { type: string, maxLength: 50 }
        origen_archivo: { type: string, maxLength: 200 }

    MigracionRequest:
      type: object
      required: [fichas]
      properties:
        fichas:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: '#/components/schemas/FichaLegada'

    MigracionResponse:
      type: object
      properties:
        total: { type: integer }
        migradas: { type: integer }
        observadas: { type: integer }
        detalle:
          type: array
          items:
            type: object
            properties:
              id_ficha: { type: string }
              estado: { type: string, enum: [MIGRADA, OBSERVADA] }
              entidad_destino_id: { type: string, format: uuid, nullable: true }
              observacion: { type: string, nullable: true }

    MovimientoAlmacen:
      type: object
      description: Movimiento de almacén que alimenta el libro 12.1 (inventario permanente en unidades físicas)
      required:
        - fecha
        - tipo_movimiento
        - establecimiento
        - tipo_existencia
        - tipo_operacion
        - documento_soporte
        - producto_codigo
        - unidad_medida
        - cantidad
        - saldo_cantidad
        - saldo_valor
      properties:
        id: { type: string, format: uuid, readOnly: true }
        fecha: { type: string, format: date }
        tipo_movimiento: { type: string, enum: [INGRESO, SALIDA] }
        establecimiento: { type: string, pattern: '^[0-9]{4}$' }
        tipo_existencia:
          type: string
          pattern: '^[0-9]{2}$'
          description: Tabla 5 SUNAT
        tipo_operacion:
          type: string
          pattern: '^[0-9]{2}$'
          description: Tabla 12 SUNAT
        documento_soporte:
          type: object
          required: [tipo, serie_numero, fecha]
          properties:
            tipo: { type: string, pattern: '^[0-9]{2}$', description: Tabla 10 SUNAT }
            serie_numero: { type: string, pattern: '^[A-Z0-9]{4}-[0-9]{1,8}$' }
            fecha: { type: string, format: date }
        producto_codigo: { type: string, maxLength: 30 }
        unidad_medida:
          type: string
          pattern: '^[A-Z0-9]{2,3}$'
          description: Tabla 6 SUNAT, equivalente al catálogo 03
        cantidad: { type: number, exclusiveMinimum: true, minimum: 0 }
        costo_unitario: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        saldo_cantidad: { type: number, minimum: 0 }
        saldo_valor: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        origen_ficha_id: { type: string, maxLength: 50 }

    RegistroVenta:
      type: object
      description: Línea del Registro de Ventas e Ingresos (Formato 14.1)
      required:
        - fecha_emision
        - tipo_comprobante
        - serie_numero
        - cliente_documento
        - cliente_razon_social
        - base_gravada
        - igv
        - importe_total
        - moneda
        - estado
      properties:
        id: { type: string, format: uuid, readOnly: true }
        fecha_emision: { type: string, format: date }
        tipo_comprobante: { type: string, enum: ['01', '03', '07', '08'] }
        serie_numero: { type: string, pattern: '^[FB][A-Z0-9]{3}-[0-9]{1,8}$' }
        cliente_documento:
          type: object
          required: [tipo, numero]
          properties:
            tipo: { type: string, enum: ['0', '1', '4', '6', '7', 'A'], description: Catálogo 06 }
            numero: { type: string, minLength: 1, maxLength: 15 }
        cliente_razon_social: { type: string, minLength: 3, maxLength: 200 }
        base_gravada: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        base_exonerada: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        base_inafecta: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        base_exportacion: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        igv: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        isc: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        icbper: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        importe_total: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
        moneda: { type: string, enum: [PEN, USD] }
        tipo_cambio: { type: string, pattern: '^\d+(\.\d{1,6})?$' }
        estado: { type: string, enum: [REGISTRADO, ANULADO] }
        comprobante_id: { type: string, format: uuid }

    ErrorValidacion:
      type: object
      required: [codigo, errores]
      properties:
        codigo:
          type: string
          enum:
            - VALIDACION_ESQUEMA
            - VALIDACION_NEGOCIO
            - NO_ENCONTRADO
            - CONFLICTO
            - XML_INVALIDO
            - ERROR_ENVIO
            - NO_AUTORIZADO
            - PROHIBIDO
        mensaje: { type: string }
        errores:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }
