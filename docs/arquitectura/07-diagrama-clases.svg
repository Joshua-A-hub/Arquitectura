<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .cls { fill: #EEF2FF; stroke: #4338CA; stroke-width: 2; }
      .vo { fill: #ECFDF5; stroke: #047857; stroke-width: 2; }
      .doc { fill: #FEF3C7; stroke: #B45309; stroke-width: 2; }
      .sep { stroke: #4338CA; stroke-width: 1; }
      .sepg { stroke: #047857; stroke-width: 1; }
      .sepa { stroke: #B45309; stroke-width: 1; }
      .name { font-size: 14px; font-weight: 700; fill: #111827; }
      .attr { font-size: 10.5px; fill: #1F2937; }
      .card { font-size: 11px; fill: #6B7280; font-weight: 600; }
      .cap { font-size: 11.5px; fill: #6B7280; }
      .ln { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#fl); }
      .lnd { stroke: #374151; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="760" fill="#FFFFFF"/>
  <text x="450" y="32" text-anchor="middle" class="name" font-size="20">Modelo de dominio — diagrama de clases</text>
  <text x="450" y="52" text-anchor="middle" class="cap">Comprobante es la raíz de agregado · Totales y Cdr son objetos de valor inmutables</text>

  <!-- Empresa -->
  <rect class="cls" x="30" y="70" width="240" height="126" rx="8"/>
  <text x="40" y="88" class="name">Empresa (emisor)</text>
  <line class="sep" x1="30" y1="98" x2="270" y2="98"/>
  <text x="40" y="114" class="attr">ruc: RUC</text>
  <text x="40" y="129" class="attr">razonSocial: String(200)</text>
  <text x="40" y="144" class="attr">nombreComercial: String(200)</text>
  <text x="40" y="159" class="attr">ubigeo: Ubigeo(6)</text>
  <text x="40" y="174" class="attr">direccion: String(200)</text>
  <text x="40" y="189" class="attr">regimenTributario: enum</text>

  <!-- Cuota -->
  <rect class="vo" x="320" y="70" width="240" height="66" rx="8"/>
  <text x="330" y="88" class="name">Cuota «VO»</text>
  <line class="sepg" x1="320" y1="98" x2="560" y2="98"/>
  <text x="330" y="114" class="attr">monto: Decimal(12,2)</text>
  <text x="330" y="129" class="attr">fechaVencimiento: Date</text>

  <!-- Cliente -->
  <rect class="cls" x="630" y="70" width="240" height="141" rx="8"/>
  <text x="640" y="88" class="name">Cliente (receptor)</text>
  <line class="sep" x1="630" y1="98" x2="870" y2="98"/>
  <text x="640" y="114" class="attr">id: UUID</text>
  <text x="640" y="129" class="attr">tipoDocumento: Cat. 8</text>
  <text x="640" y="144" class="attr">numeroDocumento: String(15)</text>
  <text x="640" y="159" class="attr">razonSocial: String(200)</text>
  <text x="640" y="174" class="attr">ubigeo: Ubigeo(6)</text>
  <text x="640" y="189" class="attr">direccion: String(200)</text>
  <text x="640" y="204" class="attr">email: String(120)</text>

  <!-- Comprobante -->
  <rect class="cls" x="310" y="250" width="260" height="216" rx="10"/>
  <text x="320" y="270" class="name">Comprobante «raíz»</text>
  <line class="sep" x1="310" y1="280" x2="570" y2="280"/>
  <text x="320" y="296" class="attr">id: UUID</text>
  <text x="320" y="311" class="attr">tipo: Cat. 1</text>
  <text x="320" y="326" class="attr">serie: String(4)</text>
  <text x="320" y="341" class="attr">correlativo: Integer</text>
  <text x="320" y="356" class="attr">serieNumero: String(13)</text>
  <text x="320" y="371" class="attr">fechaEmision: Date</text>
  <text x="320" y="386" class="attr">horaEmision: Time</text>
  <text x="320" y="401" class="attr">moneda: Cat. 2</text>
  <text x="320" y="416" class="attr">tipoOperacion: Cat. 51</text>
  <text x="320" y="431" class="attr">formaPago: enum</text>
  <text x="320" y="446" class="attr">estado: Estado</text>
  <text x="320" y="461" class="attr">hashXml: String(64)</text>

  <!-- Totales -->
  <rect class="vo" x="620" y="300" width="250" height="156" rx="8"/>
  <text x="630" y="320" class="name">Totales «VO»</text>
  <line class="sepg" x1="620" y1="330" x2="870" y2="330"/>
  <text x="630" y="346" class="attr">opGravada: Decimal(12,2)</text>
  <text x="630" y="361" class="attr">opExonerada: Decimal(12,2)</text>
  <text x="630" y="376" class="attr">opInafecta: Decimal(12,2)</text>
  <text x="630" y="391" class="attr">opExportacion: Decimal(12,2)</text>
  <text x="630" y="406" class="attr">totalIgv: Decimal(12,2)</text>
  <text x="630" y="421" class="attr">totalIsc: Decimal(12,2)</text>
  <text x="630" y="436" class="attr">totalIcbper: Decimal(12,2)</text>
  <text x="630" y="451" class="attr">importeTotal: Decimal(12,2)</text>

  <!-- Producto -->
  <rect class="cls" x="30" y="430" width="240" height="156" rx="8"/>
  <text x="40" y="448" class="name">Producto</text>
  <line class="sep" x1="30" y1="458" x2="270" y2="458"/>
  <text x="40" y="474" class="attr">codigo: String(30)</text>
  <text x="40" y="489" class="attr">descripcion: String(200)</text>
  <text x="40" y="504" class="attr">unidadMedida: Cat. 3</text>
  <text x="40" y="519" class="attr">precioUnitario: Decimal(12,2)</text>
  <text x="40" y="534" class="attr">afectacionIgv: Cat. 7</text>
  <text x="40" y="549" class="attr">tasaIsc: Decimal(5,2)</text>
  <text x="40" y="564" class="attr">esBolsaPlastica: Boolean</text>
  <text x="40" y="579" class="attr">stockActual: Decimal(12,3)</text>

  <!-- LineaDetalle -->
  <rect class="cls" x="310" y="520" width="260" height="171" rx="8"/>
  <text x="320" y="540" class="name">LineaDetalle</text>
  <line class="sep" x1="310" y1="550" x2="570" y2="550"/>
  <text x="320" y="566" class="attr">numeroLinea: Integer</text>
  <text x="320" y="581" class="attr">descripcion: String(200)</text>
  <text x="320" y="596" class="attr">unidadMedida: Cat. 3</text>
  <text x="320" y="611" class="attr">cantidad: Decimal(12,3)</text>
  <text x="320" y="626" class="attr">valorUnitario: Decimal(12,6)</text>
  <text x="320" y="641" class="attr">precioUnitario: Decimal(12,6)</text>
  <text x="320" y="656" class="attr">descuento: Decimal(12,2)</text>
  <text x="320" y="671" class="attr">afectacionIgv: Cat. 7</text>
  <text x="320" y="686" class="attr">totalLinea: Decimal(12,2)</text>

  <!-- Cdr -->
  <rect class="doc" x="620" y="520" width="250" height="81" rx="8"/>
  <text x="630" y="540" class="name">Cdr «VO»</text>
  <line class="sepa" x1="620" y1="550" x2="870" y2="550"/>
  <text x="630" y="566" class="attr">codigo: String</text>
  <text x="630" y="581" class="attr">descripcion: String</text>
  <text x="630" y="596" class="attr">fechaRecepcion: DateTime</text>

  <!-- Relaciones -->
  <!-- Empresa 1 -> 0..* Comprobante -->
  <line class="ln" x1="270" y1="140" x2="308" y2="292"/>
  <text x="278" y="202" class="card">1</text>
  <text x="276" y="262" class="card">0..*</text>

  <!-- Cuota 0..* compone Comprobante -->
  <line class="lnd" x1="440" y1="136" x2="440" y2="246"/>
  <text x="412" y="152" class="card">0..*</text>
  <polygon points="440,229 450,238 440,247 430,238" fill="#374151"/>

  <!-- Cliente 1 -> 0..* Comprobante -->
  <line class="ln" x1="628" y1="150" x2="574" y2="300"/>
  <text x="598" y="188" class="card">1</text>
  <text x="602" y="232" class="card">0..*</text>

  <!-- Comprobante ◆-> LineaDetalle -->
  <line class="lnd" x1="440" y1="466" x2="440" y2="516"/>
  <polygon points="440,465 450,474 440,483 430,474" fill="#374151"/>
  <text x="448" y="510" class="card">1..*</text>

  <!-- Comprobante ◆-> Totales -->
  <line class="lnd" x1="572" y1="352" x2="616" y2="372"/>
  <polygon points="566,349 577,351 575,362 564,360" fill="#374151"/>
  <text x="598" y="396" class="card">1</text>

  <!-- Comprobante ◆-> Cdr -->
  <line class="lnd" x1="572" y1="448" x2="616" y2="540"/>
  <polygon points="567,446 578,449 575,460 564,457" fill="#374151"/>
  <text x="606" y="514" class="card">0..1</text>

  <!-- Producto -> LineaDetalle (asociación) -->
  <line class="ln" x1="270" y1="540" x2="306" y2="570"/>
  <text x="274" y="530" class="card">1</text>
  <text x="280" y="586" class="card">1..*</text>

  <!-- Leyenda -->
  <polygon points="36,706 45,715 36,724 27,715" fill="#374151"/>
  <text x="54" y="719" class="cap">composición (el todo controla el ciclo de vida)</text>
  <text x="330" y="718" class="cap">→  asociación (solo referencia)</text>
  <text x="560" y="718" class="cap">«VO» objeto de valor inmutable</text>
  <text x="30" y="738" class="cap">Nota: NotaCrédito y NotaDébito son Comprobante con tipo 07/08 (misma raíz de agregado, sin jerarquía propia).</text>
  <text x="30" y="754" class="cap">FichaLegada y MovimientoAlmacen (migración) se detallan en docs/arquitectura/05-migracion-legado.md</text>
</svg>
